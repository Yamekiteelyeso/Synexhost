name: Android standalone APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Bundle pinned Android ARM64 OpenJDK 17 and 21
        shell: bash
        run: |
          set -euo pipefail
          assets="android-app/app/src/main/assets/runtimes"
          mkdir -p "$assets"
          for major in 17 21; do
            case "$major" in
              17) tag=download_jre17; sha=e162c860fe05ee4a4e4af7606437419879f6c748386a7b09fa77d10db6a64091 ;;
              21) tag=download_jre21; sha=8d41ec401ee59f7722df60ed991f81ad146e130452804bfdd8a05d3436f7bbfe ;;
            esac
            archive="$RUNNER_TEMP/jre$major.tar.xz"
            curl -fsSL --retry 3 "https://github.com/AngelAuraMC/angelauramc-openjdk-build/releases/download/$tag/jre$major-android-arm64.tar.xz" -o "$archive"
            echo "$sha  $archive" | sha256sum -c -
            source="$RUNNER_TEMP/jre$major-source"
            mkdir -p "$source"
            tar -xJf "$archive" -C "$source"
            javafile="$(find "$source" -type f -path '*/bin/java' | head -1)"
            test -n "$javafile"
            root="$(dirname "$(dirname "$javafile")")"
            test -s "$root/lib/modules"
            # Preserve bin/java in its JRE home rather than moving it.
            tar -cJf "$assets/jre$major.tar.xz" -C "$root" .
            echo "Packed Java $major: $(du -h "$assets/jre$major.tar.xz" | cut -f1)"
          done
      - name: Validate bundled Java archives and legal symlinks
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, posixpath, tarfile
          base = pathlib.Path("android-app/app/src/main/assets/runtimes")
          for major in (17, 21):
              archive = base / f"jre{major}.tar.xz"
              files, links = set(), []
              with tarfile.open(archive, "r:xz") as tar:
                  for entry in tar:
                      name = posixpath.normpath(entry.name.removeprefix("./"))
                      assert not name.startswith("../") and not name.startswith("/"), name
                      files.add(name)
                      if entry.issym():
                          assert not entry.linkname.startswith("/"), entry.linkname
                          target = posixpath.normpath(posixpath.join(posixpath.dirname(name), entry.linkname))
                          assert target != ".." and not target.startswith("../"), (name, entry.linkname)
                          links.append((name, target))
              assert {"lib/modules", "lib/libjli.so", "bin/java"} <= files, major
              launcher = pathlib.Path("android-app/app/src/main/java/com/synex/host/EmbeddedRuntime.kt").read_text()
              assert 'File(root, "bin/java")' in launcher
              assert "Os.chmod(executable.absolutePath, 493)" in launcher
              assert len(links) >= 100, (major, len(links))
              assert ("legal/java.security.jgss/LICENSE", "legal/java.base/LICENSE") in links
              print(f"Java {major}: checked {len(files)} entries and {len(links)} safe links")
          PY
      - name: Backend tests (legacy compatibility)
        run: python3 -m unittest discover -s backend/tests -v
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build standalone debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Check bundled runtime and APK
        shell: bash
        run: |
          set -euo pipefail
          apk=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | grep -E 'assets/runtimes/jre17.tar.xz'
          unzip -l "$apk" | grep -E 'assets/runtimes/jre21.tar.xz'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SynexHost-standalone-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
